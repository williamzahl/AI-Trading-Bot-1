services:
  - type: web
    name: smt-webhook
    runtime: python
    region: oregon
    plan: 0.5c-512mb
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DATABASE_URL
        fromDatabase:
          name: smt-db
          property: connectionString
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: TV_IP_ALLOWLIST
        value: "on"

databases:
  - name: smt-db
    region: oregon
    plan: 0.1c-256mb
