services:
  - type: web
    name: smt-webhook
    runtime: python
    region: oregon
    plan: 0.5c-512mb
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DATABASE_URL
        fromDatabase:
          name: smt-db
          property: connectionString
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: TV_IP_ALLOWLIST
        value: "on"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      # Ordre til MT5 via MetaApi.cloud. Ingenting sendes foer EXECUTION_ENABLED=on
      # settes i Render. Standardverdier (lot, SL/TP osv.) ligger i app/config.py.
      - key: METAAPI_TOKEN
        sync: false
      - key: METAAPI_ACCOUNT_ID
        sync: false

databases:
  - name: smt-db
    region: oregon
    plan: 0.1c-256mb
